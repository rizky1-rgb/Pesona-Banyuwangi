<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Banyuwangi - Selamat Datang</title>
    <!-- Font Google untuk tampilan modern dan mudah dibaca -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & PENGATURAN DASAR ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Mencegah scroll pada halaman intro */
            background: #000; /* Latar belakang hitam sebagai fallback */
        }

        /* ===== VARIABEL WARNA TEMA ===== */
        :root {
            --biru-langit: #87CEEB;
            --biru-laut: #1E90FF;
            --biru-tua: #003366;
            --putih: #ffffff;
        }

        /* ===== KONTAINER HALAMAN INTRO ===== */
        /* Menempati seluruh layar (full viewport) dengan flexbox untuk centering */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--putih);
            overflow: hidden;
        }

        /* ===== VIDEO LATAR BELAKANG ===== */
        /* Video akan menutupi seluruh layar dengan object-fit: cover */
        #intro-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* ===== OVERLAY GELAP DI ATAS VIDEO ===== */
        /* Memberikan efek gelap agar teks lebih terbaca di atas video */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 51, 102, 0.75) 0%,
                rgba(30, 144, 255, 0.45) 50%,
                rgba(0, 51, 102, 0.75) 100%
            );
            z-index: 1;
        }

        /* ===== PARTIKEL ANIMASI (EFEK VISUAL TAMBAHAN) ===== */
        /* Partikel-partikel kecil yang melayang untuk memberikan kesan hidup */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        /* Animasi partikel melayang dari bawah ke atas */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== KONTEN TEKS INTRO ===== */
        /* Wrapper untuk judul, deskripsi, dan tombol agar animasi terkoordinasi */
        .intro-content {
            position: relative;
            z-index: 3;
            max-width: 900px;
            padding: 0 20px;
        }

        /* ===== JUDUL UTAMA ===== */
        /* Animasi fade-in dari atas dengan delay */
        #intro-screen h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(-60px);
            animation: slideDown 1s ease 0.5s forwards;
        }

        /* ===== SUB-JUDUL / DESKRIPSI ===== */
        /* Animasi fade-in dengan delay lebih lama dari judul */
        #intro-screen p {
            font-size: 1.4rem;
            font-weight: 300;
            max-width: 700px;
            margin: 0 auto 3rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            line-height: 1.8;
            opacity: 0;
            transform: translateY(-40px);
            animation: slideDown 1s ease 1s forwards;
        }

        /* ===== TOMBOL START ===== */
        /* Tombol dengan efek hover yang interaktif dan glow */
        #start-btn {
            background: linear-gradient(45deg, var(--biru-laut), var(--biru-tua));
            color: var(--putih);
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.4);
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            animation: slideUp 1s ease 1.5s forwards;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        /* Efek shimmer/glow pada tombol */
        #start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.5s ease;
        }

        #start-btn:hover::before {
            left: 100%;
        }

        /* Efek hover: tombol membesar, warna berubah, dan shadow lebih kuat */
        #start-btn:hover {
            background: linear-gradient(45deg, var(--biru-tua), var(--biru-laut));
            transform: translateY(-5px) scale(1.08) !important;
            box-shadow: 0 15px 35px rgba(30, 144, 255, 0.6);
            letter-spacing: 2px;
        }

        /* Efek saat tombol diklik */
        #start-btn:active {
            transform: translateY(0) scale(0.98) !important;
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.3);
        }

        /* ===== ANIMASI KEYFRAMES ===== */
        /* Animasi slide dari atas ke posisi normal */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animasi slide dari bawah ke posisi normal */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Animasi pulse untuk menarik perhatian ke tombol */
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 8px 25px rgba(30, 144, 255, 0.4);
            }
            50% {
                box-shadow: 0 8px 35px rgba(30, 144, 255, 0.8);
            }
        }

        /* ===== INDIKATOR SCROLL / HINT ===== */
        /* Panah kecil di bawah yang beranimasi untuk menunjukkan interaksi */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            opacity: 0;
            animation: fadeInBounce 1s ease 2.5s forwards;
        }

        .scroll-hint span {
            display: block;
            width: 20px;
            height: 20px;
            border-bottom: 3px solid var(--putih);
            border-right: 3px solid var(--putih);
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: rotate(45deg) translateY(0);
            }
            40% {
                transform: rotate(45deg) translateY(-10px);
            }
            60% {
                transform: rotate(45deg) translateY(-5px);
            }
        }

        @keyframes fadeInBounce {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.7;
            }
        }

        /* ===== EFEK TRANSISI KELUAR ===== */
        /* Saat tombol diklik, halaman akan fade out dengan zoom */
        .fade-out {
            animation: fadeOutZoom 0.8s ease forwards;
        }

        @keyframes fadeOutZoom {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.1);
            }
        }

        /* ===== RESPONSIF UNTUK MOBILE ===== */
        @media (max-width: 768px) {
            #intro-screen h1 {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }

            #intro-screen p {
                font-size: 1.1rem;
                padding: 0 15px;
            }

            #start-btn {
                padding: 1rem 2rem;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            #intro-screen h1 {
                font-size: 2rem;
            }

            #intro-screen p {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            #start-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== HALAMAN INTRO / PEMBUKA ===== -->
    <div id="intro-screen">
        <!-- Video latar belakang yang autoplay, muted, dan loop -->
        <video id="intro-video" autoplay muted playsinline loop>
            <source src="assets/vid/teaser.mp4" type="video/mp4">
            <!-- Fallback gambar jika video tidak bisa dimuat -->
            <img src="https://placehold.co/1200x800/1E90FF/FFFFFF?text=Gunung+Ijen+Banyuwangi" alt="Fallback background">
        </video>

        <!-- Overlay gelap agar teks terlihat jelas di atas video -->
        <div class="video-overlay"></div>

        <!-- Partikel animasi untuk efek visual yang lebih hidup -->
        <div class="particles" id="particles"></div>

        <!-- Konten utama: judul, deskripsi, dan tombol -->
        <div class="intro-content">
            <h1>Pesona Banyuwangi</h1>
            <p>Temukan keindahan alam dan budaya yang memukau di ujung timur Pulau Jawa</p>
            <!-- Tombol Start yang mengarah ke halaman utama (index.html) -->
            <a href="home.html" id="start-btn">Mulai Jelajah</a>
        </div>

        <!-- Indikator visual di bagian bawah halaman -->
        <div class="scroll-hint">
            <span></span>
        </div>
    </div>

    <script>
        // ===== GENERATOR PARTIKEL ANIMASI =====
        // Membuat partikel-partikel kecil yang melayang secara acak
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30; // Jumlah partikel

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                // Posisi horizontal acak (0-100% dari lebar layar)
                particle.style.left = Math.random() * 100 + '%';

                // Ukuran partikel acak (3px - 8px)
                const size = Math.random() * 5 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                // Durasi animasi acak (5-15 detik) agar tidak serempak
                particle.style.animationDuration = (Math.random() * 10 + 5) + 's';

                // Delay animasi acak agar partikel muncul bertahap
                particle.style.animationDelay = (Math.random() * 5) + 's';

                // Opasitas acak untuk variasi visual
                particle.style.opacity = Math.random() * 0.5 + 0.3;

                container.appendChild(particle);
            }
        }

        // Jalankan generator partikel saat halaman dimuat
        createParticles();

        // ===== EFEK TRANSISI SAAT TOMBOL DIKLIK =====
        // Memberikan animasi fade-out + zoom sebelum pindah ke halaman utama
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', function(e) {
            e.preventDefault(); // Mencegah navigasi langsung

            const introScreen = document.getElementById('intro-screen');
            introScreen.classList.add('fade-out'); // Tambahkan animasi keluar

            // Setelah animasi selesai (800ms), baru pindah ke halaman utama
            setTimeout(() => {
                window.location.href = this.href;
            }, 800);
        });

        // ===== PRELOADER VIDEO =====
        // Memastikan video sudah cukup dimuat sebelum menampilkan konten
        const video = document.getElementById('intro-video');
        video.addEventListener('loadeddata', function() {
            console.log('Video berhasil dimuat');
        });

        // Fallback jika video gagal dimuat (misal: file tidak ada)
        video.addEventListener('error', function() {
            console.log('Video gagal dimuat, menggunakan fallback background');
            document.body.style.background = 'linear-gradient(135deg, #003366, #1E90FF)';
        });
    </script>
</body>
</html>
